# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  push:
    branches:
      - "master"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Define the Node.js version explicitly
        
      - name: Install dependencies
        run: npm install  # Install all necessary dependencies for the project

      - name: Run tests (optional)
        run: npm test  # Run your test scripts if you have any (optional step)

  publish:
    needs: build  # The publish job depends on the build job
    runs-on: ubuntu-latest
    permissions:
      contents: read   # Allow read access to the repository content
      packages: write  # Allow write access to GitHub Packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js for publishing
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://npm.pkg.github.com  # Set the npm registry to GitHub Packages

      - name: Install dependencies
        run: npm ci  # Clean install for CI environments

      - name: Publish package to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Use the GitHub token to authenticate for publishing
